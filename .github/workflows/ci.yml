name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.compiler }} build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.compiler }} CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -g -O2"
      - name: Unit and end-to-end tests
        run: make test CC=${{ matrix.compiler }}

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize CC=clang

  bench-smoke:
    name: Benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a small benchmark to catch regressions that crash
        run: make bench BENCH_ARGS="--quick"
